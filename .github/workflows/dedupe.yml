name: Species Dedupe

# Manual only: Actions -> Species Dedupe -> Run workflow
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run lists duplicates, apply removes them"
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Remove duplicates
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "apply" ]; then
            python src/dedupe.py --apply
          else
            python src/dedupe.py
          fi
